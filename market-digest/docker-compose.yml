# Market Digest bot: n8n + Postgres + Gotenberg
# Runs as its own Compose project, isolated from your other project.
name: market-digest

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n                      # n8n's internal database
      TZ: Asia/Kolkata
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init/init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # creates the "digest" DB, runs on first start only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No host port: only n8n needs it, over the internal network.
    # Uncomment to inspect from a DB client on your PC (5433 avoids clashing with any existing Postgres on 5432):
    # ports:
    #   - "5433:5432"

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "${N8N_PORT}:5678"                  # open http://localhost:${N8N_PORT}
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: Asia/Kolkata        # cron nodes fire in IST
      TZ: Asia/Kolkata
      N8N_SECURE_COOKIE: "false"            # local http access
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      NODE_OPTIONS: "--dns-result-order=ipv4first"   # fixes SSL errors to api.groq.com on this network
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "72"                    # keep 3 days of run history
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    # Internal only: n8n calls http://gotenberg:3000/forms/chromium/convert/html
    command:
      - gotenberg
      - --chromium-auto-start=false         # start Chromium only when a PDF is requested
    mem_limit: 1g

volumes:
  pg_data:
  n8n_data:
